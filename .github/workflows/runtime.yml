name: Android Java 17.0.20
on:
  push:
    branches: [main]
    paths: ['runtime-build/build.sh', 'runtime-build/*.patch', '.github/workflows/runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Check immutable runtime release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test "$GITHUB_EVENT_NAME" = push && gh release view runtime-17.0.20-android-1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install cross-build dependencies
        if: steps.release.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxt-dev
      - name: Build pinned Java sources for Android ARM64
        if: steps.release.outputs.exists != 'true'
        run: bash runtime-build/build.sh "$RUNNER_TEMP/wurm-jdk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.release.outputs.exists != 'true'
        with:
          name: android-java17.0.20
          path: ${{ runner.temp }}/wurm-jdk/dist/
          if-no-files-found: error
      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java-build-diagnostics
          path: |
            ${{ runner.temp }}/wurm-jdk/build/openjdk/build/*/configure.log
            ${{ runner.temp }}/wurm-jdk/build/openjdk/build/*/build.log
            ${{ runner.temp }}/wurm-jdk/build/openjdk/build/*/make-support/failure-summary
          if-no-files-found: ignore
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          tag=runtime-17.0.20-android-1
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh run download "$GITHUB_RUN_ID" --name android-java17.0.20 --dir dist
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title 'Android OpenJDK 17.0.20 ARM64 — source build 1' \
            --notes-file dist/README.md dist/*
