name: Wurm Server APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned SDK packages
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk-wurm"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/android-commandline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          sdkmanager="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          # yes exits with SIGPIPE after sdkmanager finishes reading its answers.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - name: Fetch pinned public JDBC fixture for storage tests
        run: |
          curl -fLsS --retry 3 --max-time 120 \
            https://repo.maven.apache.org/maven2/org/xerial/sqlite-jdbc/3.53.2.1/sqlite-jdbc-3.53.2.1.jar \
            -o "$RUNNER_TEMP/sqlite-jdbc-test.jar"
          echo "WURM_TEST_SQLITE_JAR=$RUNNER_TEMP/sqlite-jdbc-test.jar" >> "$GITHUB_ENV"
      - name: Test supervisor, native helpers and storage audit
        run: |
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python3 -m unittest discover -s tests -v
      - name: Build, unit test and lint
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleJvmProbe :app:testJvmProbeUnitTest :app:lintJvmProbe :app:assembleManagedPreview :app:testManagedPreviewUnitTest :app:lintManagedPreview
      - name: Prepare import preview
        run: |
          python3 - <<'PY'
          import base64, pathlib, zipfile
          expected = base64.b64decode(pathlib.Path('poc/artifacts/wurm-arm64-poc.jar.base64').read_bytes())
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              assert apk.read('assets/wurm-arm64-poc.jar') == expected, 'POC APK asset mismatch'
          print('Verified APK contains the exact source-backed POC artifact.')
          PY
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Wurm-Server.apk
          cp docs/RELEASE_IMPORT_PREVIEW.md dist/release-notes.md
          cd dist
          sha256sum Wurm-Server.apk > SHA256SUMS
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wurm-server-import-preview
          path: dist/
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Verify and prepare JVM diagnostic release
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, zipfile
          with zipfile.ZipFile('app/build/outputs/apk/jvmProbe/app-jvmProbe.apk') as apk:
              info = json.loads(apk.read('assets/jvm-runtime.json'))
              assert hashlib.sha256(apk.read('assets/jre17-data.zip')).hexdigest() == info['dataSha256']
              with zipfile.ZipFile(io.BytesIO(apk.read('assets/jre17-data.zip'))) as jre:
                  assert hashlib.sha256(jre.read('lib/modules')).hexdigest() == info['modulesSha256']
              for name, digest in info['nativeSha256'].items():
                  assert hashlib.sha256(apk.read('lib/arm64-v8a/' + name)).hexdigest() == digest, name
              assert apk.read('lib/arm64-v8a/libwurmjvm_runner.so')[:4] == b'\x7fELF'
              assert apk.read('assets/runtime-probe.jar')[:2] == b'PK'
          print('Verified Android runtime, native runner and diagnostic JAR in APK.')
          PY
          mkdir -p diagnostic-dist
          cp app/build/outputs/apk/jvmProbe/app-jvmProbe.apk diagnostic-dist/Wurm-Server-JVM-Test.apk
          cp docs/RELEASE_JVM_PROBE.md diagnostic-dist/release-notes.md
          cp docs/RUNTIME_PROVENANCE.md diagnostic-dist/RUNTIME_PROVENANCE.md
          curl -fL --retry 3 --max-time 300 \
            https://github.com/openjdk/jdk17u/archive/ca760c86642aa2e0d9b571aaabac054c0239fbdc.tar.gz \
            -o diagnostic-dist/OpenJDK17-base-source.tar.gz
          curl -fL --retry 3 --max-time 300 \
            https://github.com/FCL-Team/Android-OpenJDK-Build/archive/ce21ce33b4f495e678c2cfdecb6abe893bf561ee.tar.gz \
            -o diagnostic-dist/Android-OpenJDK-build-source.tar.gz
          cd diagnostic-dist
          sha256sum Wurm-Server-JVM-Test.apk *.tar.gz RUNTIME_PROVENANCE.md > SHA256SUMS
      - name: Upload JVM diagnostic APK and runtime sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wurm-jvm-probe
          path: diagnostic-dist/
          if-no-files-found: error

      - name: Verify and prepare managed server release
        run: |
          python3 scripts/verify-managed-apk.py app/build/outputs/apk/managedPreview/app-managedPreview.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/managedPreview/app-managedPreview.apk
          mkdir -p managed-dist/runtime-sources
          cp app/build/outputs/apk/managedPreview/app-managedPreview.apk managed-dist/Wurm-Server.apk
          cp docs/RELEASE_GRAPHICS_PREVIEW.md managed-dist/release-notes.md
          cp docs/GRAPHICS_THOR_TEST.md managed-dist/GRAPHICS_THOR_TEST.md
          cp app/build/generated/clientGraphics/assets/client-graphics.json managed-dist/client-graphics.json
          cp app/build/generated/clientGraphics/assets/graphics-NOTICES.txt managed-dist/graphics-NOTICES.txt
          mkdir -p managed-dist/graphics-sources/upstream managed-dist/graphics-sources/scripts
          cp app/build/graphicsDownloads/lwjgl.tar.gz app/build/graphicsDownloads/gl4es.tar.gz app/build/graphicsDownloads/libffi.tar.gz app/build/graphicsDownloads/pojav.tar.gz managed-dist/graphics-sources/upstream/
          cp -R graphics-compat managed-dist/graphics-sources/
          mkdir -p managed-dist/graphics-sources/runtime-probe/src/client
          cp runtime-probe/src/client/DesktopInput.java managed-dist/graphics-sources/runtime-probe/src/client/
          cp scripts/prepare-client-graphics.py scripts/build-lwjgl-api.py scripts/build-window-api.py scripts/test-window-host.py scripts/ExportAuditPlatform.java managed-dist/graphics-sources/scripts/
          cp docs/GRAPHICS_THOR_TEST.md managed-dist/graphics-sources/README.md
          cp managed-dist/client-graphics.json managed-dist/graphics-NOTICES.txt managed-dist/graphics-sources/
          tar -czf managed-dist/Graphics-corresponding-source.tar.gz -C managed-dist graphics-sources
          rm -r managed-dist/graphics-sources
          cp docs/CLIENT_THOR_TEST.md managed-dist/CLIENT_THOR_TEST.md
          cp docs/CLIENT_SETTINGS_FIX.md managed-dist/CLIENT_SETTINGS_FIX.md
          cp docs/CLIENT_FONTS_FIX.md managed-dist/CLIENT_FONTS_FIX.md
          cp docs/CLIENT_WINDOW_START_FIX.md managed-dist/CLIENT_WINDOW_START_FIX.md
          cp docs/CLIENT_OFFSCREEN_FIX.md managed-dist/CLIENT_OFFSCREEN_FIX.md
          cp docs/CLIENT_BUFFERS_FIX.md managed-dist/CLIENT_BUFFERS_FIX.md
          cp docs/CLIENT_MATERIALS_FIX.md managed-dist/CLIENT_MATERIALS_FIX.md
          cp docs/CLIENT_CAPABILITIES_FIX.md managed-dist/CLIENT_CAPABILITIES_FIX.md
          cp docs/CLIENT_CRASH_DIAGNOSTIC.md managed-dist/CLIENT_CRASH_DIAGNOSTIC.md
          cp docs/CLIENT_INTEGRATION.md managed-dist/CLIENT_INTEGRATION.md
          cp docs/MANAGED_SERVER_TEST.md managed-dist/MANAGED_SERVER_TEST.md
          cp docs/THOR_NATIVE_HEAP_FIX.md managed-dist/THOR_NATIVE_HEAP_FIX.md
          cp docs/STORAGE_VERIFICATION.md managed-dist/STORAGE_VERIFICATION.md
          cp docs/WORLD_CONFIGURATION_TEST.md managed-dist/WORLD_CONFIGURATION_TEST.md
          cp runtime-build/runtime.json managed-dist/runtime.json
          # The source bundle must correspond to the binary pin, not a later
          # mutable branch snapshot. Check every downloaded companion source.
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          pin = json.loads(pathlib.Path('runtime-build/runtime.json').read_text())
          base = pin['url'].rsplit('/', 1)[0] + '/'
          dest = pathlib.Path('managed-dist/runtime-sources')
          subprocess.run(['curl', '-fsSL', '--retry', '3', base + 'SHA256SUMS', '-o', str(dest/'SHA256SUMS')], check=True)
          entries = {}
          for line in (dest/'SHA256SUMS').read_text().splitlines():
              digest, name = line.split(None, 1)
              entries[name.removeprefix('./')] = digest
          assert entries['android-jre17.0.20-arm64.tar.xz'] == pin['sha256']
          for name in ['OpenJDK17-source.tar.gz', 'Android-build-source.tar.gz', 'freetype-source.tar.gz',
                       'cups-source.tar.gz', 'android-17.0.20.patch', 'build.sh', 'README.md']:
              target = dest/name
              subprocess.run(['curl', '-fsSL', '--retry', '3', '--max-time', '300', base + name, '-o', str(target)], check=True)
              assert hashlib.sha256(target.read_bytes()).hexdigest() == entries[name], name
          PY
          tar -czf managed-dist/Runtime-corresponding-source.tar.gz -C managed-dist runtime-sources
          rm -r managed-dist/runtime-sources
          cd managed-dist
          sha256sum Wurm-Server.apk CLIENT_CRASH_DIAGNOSTIC.md CLIENT_CAPABILITIES_FIX.md CLIENT_MATERIALS_FIX.md CLIENT_BUFFERS_FIX.md CLIENT_OFFSCREEN_FIX.md CLIENT_WINDOW_START_FIX.md CLIENT_FONTS_FIX.md CLIENT_SETTINGS_FIX.md GRAPHICS_THOR_TEST.md client-graphics.json graphics-NOTICES.txt Graphics-corresponding-source.tar.gz CLIENT_THOR_TEST.md CLIENT_INTEGRATION.md MANAGED_SERVER_TEST.md THOR_NATIVE_HEAP_FIX.md STORAGE_VERIFICATION.md WORLD_CONFIGURATION_TEST.md runtime.json Runtime-corresponding-source.tar.gz > SHA256SUMS
      - name: Upload managed server APK and matching runtime source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wurm-managed-server
          path: managed-dist/
          if-no-files-found: error

  publish-import-preview:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-wurm-import-preview
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_TAG: v0.2.0-import-preview
    steps:
      - name: Publish the first passing import preview
        run: |
          # One immutable preview. Later pushes do not replace its APK or tag.
          if gh release view "$PREVIEW_TAG" > /dev/null 2>&1; then
            echo "Import preview already published; leaving it unchanged."
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --name wurm-server-import-preview --dir dist
          gh release create "$PREVIEW_TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'Wurm Server 0.2.0 — import preview' \
            --notes-file dist/release-notes.md \
            'dist/Wurm-Server.apk#Wurm Server APK' dist/SHA256SUMS

  publish-jvm-probe:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-wurm-jvm-probe
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PROBE_TAG: v0.3.2-jvm-probe
    steps:
      - name: Publish first passing JVM diagnostic APK
        run: |
          if gh release view "$PROBE_TAG" > /dev/null 2>&1; then
            echo "JVM diagnostic already published; leaving it unchanged."
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --name wurm-jvm-probe --dir dist
          gh release create "$PROBE_TAG" --target "$GITHUB_SHA" --prerelease \
            --title 'Wurm Server 0.3.2 — JVM image layout fix' --notes-file dist/release-notes.md \
            'dist/Wurm-Server-JVM-Test.apk#Wurm Server JVM Test APK' dist/SHA256SUMS \
            dist/RUNTIME_PROVENANCE.md dist/OpenJDK17-base-source.tar.gz dist/Android-OpenJDK-build-source.tar.gz

  publish-managed-server:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-wurm-managed-server
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish first passing managed server preview
        run: |
          tag=v0.10.8-client-crash
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Managed preview already published; keeping its APK and tag immutable.'
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --name wurm-managed-server --dir dist
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title 'Wurm Server 0.10.8 — client crash diagnostic' --notes-file dist/release-notes.md \
            'dist/Wurm-Server.apk#Wurm Server APK' dist/SHA256SUMS dist/CLIENT_CRASH_DIAGNOSTIC.md dist/CLIENT_CAPABILITIES_FIX.md dist/CLIENT_MATERIALS_FIX.md dist/CLIENT_BUFFERS_FIX.md dist/CLIENT_OFFSCREEN_FIX.md dist/CLIENT_WINDOW_START_FIX.md dist/CLIENT_FONTS_FIX.md dist/CLIENT_SETTINGS_FIX.md dist/CLIENT_THOR_TEST.md dist/CLIENT_INTEGRATION.md dist/MANAGED_SERVER_TEST.md \
            dist/GRAPHICS_THOR_TEST.md dist/client-graphics.json dist/graphics-NOTICES.txt dist/Graphics-corresponding-source.tar.gz \
            dist/THOR_NATIVE_HEAP_FIX.md dist/STORAGE_VERIFICATION.md dist/WORLD_CONFIGURATION_TEST.md dist/runtime.json dist/Runtime-corresponding-source.tar.gz
