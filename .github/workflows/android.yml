name: Wurm Server APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned SDK packages
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk-wurm"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/android-commandline-tools.zip"
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/12.0"
          sdkmanager="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          # yes exits with SIGPIPE after sdkmanager finishes reading its answers.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-34' 'build-tools;34.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Test supervisor
        run: python3 -m unittest discover -s tests -v
      - name: Build, unit test and lint
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Prepare import preview
        run: |
          python3 - <<'PY'
          import base64, pathlib, zipfile
          expected = base64.b64decode(pathlib.Path('poc/artifacts/wurm-arm64-poc.jar.base64').read_bytes())
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              assert apk.read('assets/wurm-arm64-poc.jar') == expected, 'POC APK asset mismatch'
          print('Verified APK contains the exact source-backed POC artifact.')
          PY
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Wurm-Server.apk
          cp docs/RELEASE_IMPORT_PREVIEW.md dist/release-notes.md
          cd dist
          sha256sum Wurm-Server.apk > SHA256SUMS
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wurm-server-import-preview
          path: dist/
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: app/build/reports/
          if-no-files-found: ignore

  publish-import-preview:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-wurm-import-preview
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_TAG: v0.2.0-import-preview
    steps:
      - name: Publish the first passing import preview
        run: |
          # One immutable preview. Later pushes do not replace its APK or tag.
          if gh release view "$PREVIEW_TAG" > /dev/null 2>&1; then
            echo "Import preview already published; leaving it unchanged."
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --name wurm-server-import-preview --dir dist
          gh release create "$PREVIEW_TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'Wurm Server 0.2.0 — import preview' \
            --notes-file dist/release-notes.md \
            'dist/Wurm-Server.apk#Wurm Server APK' dist/SHA256SUMS
